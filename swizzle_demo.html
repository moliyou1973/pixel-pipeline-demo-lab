<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Swizzle 通道重排演示</title>
<style>
body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0b0f19; color: #e2e8f0; padding: 20px; margin: 0; }
h2 { color: #22d3ee; margin: 0 0 8px 0; font-size: 18px; }
.subtitle { color: #94a3b8; font-size: 13px; margin-bottom: 16px; }
.container { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 800px; }
.card { background: #151b2e; border: 1px solid #2d3a5c; border-radius: 8px; padding: 12px; }
.card-title { font-size: 13px; font-weight: bold; margin-bottom: 8px; }
canvas { width: 100%; border-radius: 4px; background: #000; image-rendering: pixelated; }
.preset-row { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.preset-btn { background: #1e293b; color: #94a3b8; border: 1px solid #475569; border-radius: 4px; padding: 6px 10px; font-size: 11px; cursor: pointer; }
.preset-btn.active { background: #2d3a5c; color: #e2e8f0; border-color: #22d3ee; }
.custom-row { display: flex; gap: 6px; margin-top: 8px; align-items: center; }
.custom-row select { flex: 1; background: #1e293b; color: #e2e8f0; border: 1px solid #475569; border-radius: 4px; padding: 4px; font-size: 11px; }
.custom-row label { font-size: 11px; width: 16px; text-align: center; }
.desc { font-size: 11px; color: #94a3b8; margin-top: 8px; line-height: 1.5; }
</style>
<base target="_blank">
</head>
<body>
<h2>🎨 Swizzle — 通道重排与 Mask 应用</h2>
<div class="subtitle">场景：彩色测试图（RGB 渐变 + 文字 + 半透明区域）。Swizzle 用于法线贴图重组、Alpha 通道提取、灰度转换等。</div>
<div class="container">
  <div class="card">
    <div class="card-title">原始输入 (RGBA)</div>
    <canvas id="srcCanvas" width="300" height="200"></canvas>
    <div class="desc">左上：红色渐变 | 右上：绿色渐变+"G" | 左下：蓝色+"B" | 右下：半透明棋盘格 (A=0.5)</div>
  </div>
  <div class="card">
    <div class="card-title">Swizzle 输出</div>
    <canvas id="dstCanvas" width="300" height="200"></canvas>
    <div class="preset-row">
      <button class="preset-btn active" onclick="applyPreset('normal',this)">Normal</button>
      <button class="preset-btn" onclick="applyPreset('bgr',this)">BGR</button>
      <button class="preset-btn" onclick="applyPreset('gray',this)">Grayscale</button>
      <button class="preset-btn" onclick="applyPreset('red',this)">Red Only</button>
      <button class="preset-btn" onclick="applyPreset('alpha',this)">Alpha Mask</button>
      <button class="preset-btn" onclick="applyPreset('normalmap',this)">Normal Map</button>
    </div>
    <div class="custom-row">
      <label style="color:#f87171;">R</label><select id="sR" onchange="drawSwizzle()"><option value="0" selected>R</option><option value="1">G</option><option value="2">B</option><option value="3">A</option><option value="4">0</option><option value="5">1</option></select>
      <label style="color:#34d399;">G</label><select id="sG" onchange="drawSwizzle()"><option value="0">R</option><option value="1" selected>G</option><option value="2">B</option><option value="3">A</option><option value="4">0</option><option value="5">1</option></select>
      <label style="color:#38bdf8;">B</label><select id="sB" onchange="drawSwizzle()"><option value="0">R</option><option value="1">G</option><option value="2" selected>B</option><option value="3">A</option><option value="4">0</option><option value="5">1</option></select>
      <label style="color:#e2e8f0;">A</label><select id="sA" onchange="drawSwizzle()"><option value="0">R</option><option value="1">G</option><option value="2">B</option><option value="3" selected>A</option><option value="4">0</option><option value="5">1</option></select>
    </div>
    <div class="desc" id="swizzleDesc">标准 RGBA 输出，每个通道对应原始颜色。</div>
  </div>
</div>
<script>
const W = 300, H = 200;
function genSrc() {
  const img = new ImageData(W, H);
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 4;
      const nx = x / W, ny = y / H;
      let r = 0, g = 0, b = 0, a = 255;
      if (nx < 0.5 && ny < 0.5) {
        r = Math.floor(nx * 2 * 255);
        g = Math.floor(ny * 2 * 100);
      } else if (nx >= 0.5 && ny < 0.5) {
        r = Math.floor((1-nx) * 2 * 80);
        g = Math.floor((nx-0.5) * 2 * 255);
        const sx = (nx - 0.5) * 2, sy = ny * 2;
        if (sx > 0.3 && sx < 0.7 && sy > 0.3 && sy < 0.7) {
          if (Math.abs(sx-0.35)<0.05 || Math.abs(sy-0.35)<0.05 || (Math.abs(sx-0.5)<0.05 && sy>0.5) || Math.abs(sy-0.65)<0.05) {
            r = 255; g = 255; b = 255;
          }
        }
      } else if (nx < 0.5 && ny >= 0.5) {
        b = Math.floor((ny - 0.5) * 2 * 255);
        r = Math.floor(nx * 2 * 60);
        const sx = nx * 2, sy = (ny - 0.5) * 2;
        if (sx > 0.3 && sx < 0.7 && sy > 0.3 && sy < 0.7) {
          if (Math.abs(sx-0.35)<0.05 || Math.abs(sy-0.35)<0.05 || Math.abs(sy-0.5)<0.05 || Math.abs(sx-0.65)<0.05 || (Math.abs(sx-0.5)<0.05 && sy>0.5)) {
            r = 255; g = 255; b = 255;
          }
        }
      } else {
        a = 128;
        const check = ((Math.floor(x/10) + Math.floor(y/10)) % 2) === 0;
        r = check ? 200 : 50;
        g = check ? 200 : 50;
        b = check ? 50 : 200;
      }
      img.data[i] = r; img.data[i+1] = g; img.data[i+2] = b; img.data[i+3] = a;
    }
  }
  return img;
}
const srcImg = genSrc();
document.getElementById('srcCanvas').getContext('2d').putImageData(srcImg, 0, 0);

const presets = {
  normal: { r:0, g:1, b:2, a:3, desc:'标准 RGBA 输出，每个通道对应原始颜色。' },
  bgr: { r:2, g:1, b:0, a:3, desc:'BGR 交换：红蓝通道互换，用于某些纹理格式转换。' },
  gray: { r:0, g:0, b:0, a:3, desc:'Grayscale = 0.299R + 0.587G + 0.114B。此处简化为仅 R 通道。' },
  red: { r:0, g:4, b:4, a:3, desc:'仅保留红色通道，G/B 置 0。用于提取遮罩或单通道分析。' },
  alpha: { r:3, g:3, b:3, a:5, desc:'Alpha Mask：把 Alpha 通道复制到 RGB，用于查看透明区域分布。' },
  normalmap: { r:1, g:3, b:2, a:5, desc:'法线贴图重组：G→R, A→G。某些引擎把法线 XY 存于 AG 通道。' }
};

function applyPreset(name, btn) {
  const p = presets[name];
  document.getElementById('sR').value = p.r;
  document.getElementById('sG').value = p.g;
  document.getElementById('sB').value = p.b;
  document.getElementById('sA').value = p.a;
  document.getElementById('swizzleDesc').textContent = p.desc;
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  drawSwizzle();
}

function drawSwizzle() {
  const map = [
    parseInt(document.getElementById('sR').value),
    parseInt(document.getElementById('sG').value),
    parseInt(document.getElementById('sB').value),
    parseInt(document.getElementById('sA').value)
  ];
  const src = [0,0,0,0,0,255];
  const dst = new ImageData(W, H);
  const isGray = document.querySelector('.preset-btn.active')?.textContent === 'Grayscale';

  for (let i = 0; i < srcImg.data.length; i += 4) {
    const r = srcImg.data[i] / 255;
    const g = srcImg.data[i+1] / 255;
    const b = srcImg.data[i+2] / 255;
    const a = srcImg.data[i+3] / 255;
    const vals = [r, g, b, a, 0, 1];

    let outR = vals[map[0]], outG = vals[map[1]], outB = vals[map[2]];
    if (isGray) {
      const lum = r * 0.299 + g * 0.587 + b * 0.114;
      outR = lum; outG = lum; outB = lum;
    }
    dst.data[i] = Math.floor(outR * 255);
    dst.data[i+1] = Math.floor(outG * 255);
    dst.data[i+2] = Math.floor(outB * 255);
    dst.data[i+3] = Math.floor(vals[map[3]] * 255);
  }
  document.getElementById('dstCanvas').getContext('2d').putImageData(dst, 0, 0);
}
drawSwizzle();
</script>
</body>
</html>
