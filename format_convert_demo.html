<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Format Convert 色带检测演示</title>
<style>
body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0b0f19; color: #e2e8f0; padding: 20px; margin: 0; }
h2 { color: #fb923c; margin: 0 0 8px 0; font-size: 18px; }
.subtitle { color: #94a3b8; font-size: 13px; margin-bottom: 16px; }
.container { max-width: 800px; }
.card { background: #151b2e; border: 1px solid #2d3a5c; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
.card-title { font-size: 13px; font-weight: bold; margin-bottom: 8px; }
canvas { width: 100%; border-radius: 4px; background: #000; image-rendering: pixelated; }
select { width: 100%; background: #1e293b; color: #e2e8f0; border: 1px solid #475569; border-radius: 4px; padding: 6px; font-size: 12px; }
.stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 10px; }
.stat-box { background: #0f172a; border-radius: 6px; padding: 10px; text-align: center; }
.stat-val { font-size: 20px; font-weight: bold; color: #f59e0b; }
.stat-label { font-size: 10px; color: #64748b; margin-top: 2px; }
.desc { font-size: 11px; color: #94a3b8; margin-top: 8px; line-height: 1.5; }
</style>
<base target="_blank">
</head>
<body>
<h2>🔢 Format Convert — 彩虹色带检测</h2>
<div class="subtitle">场景：彩虹色相渐变（Hue 0°→360°）。人眼对色相跳变极其敏感。下方自动检测并高亮色带边界。</div>
<div class="container">
  <div class="card">
    <div class="card-title">原始 f32 浮点 — 理论完美平滑</div>
    <canvas id="srcFmt" width="720" height="80"></canvas>
  </div>
  <div class="card">
    <div class="card-title">量化后 — 色阶被压缩</div>
    <canvas id="dstFmt" width="720" height="80"></canvas>
    <select id="fmtSelect" onchange="drawFormat()" style="margin-top:8px;">
      <option value="f32_u8">f32 → U8 (256 级 — 轻微色带)</option>
      <option value="f32_u16">f32 → U16 (65536 级 — 无可见色带)</option>
      <option value="f16_u8">f16 → U8 (精度损失+量化)</option>
      <option value="u8_u5">U8 → U5 (32 级 — 色带极明显)</option>
      <option value="u8_u6">U8 → U6 (64 级 — 明显色带)</option>
      <option value="u8_u4">U8 → U4 (16 级 — 色块)</option>
    </select>
  </div>
  <div class="card">
    <div class="card-title">🚨 色带边界检测 — 白色亮线 = 色阶跳变位置</div>
    <canvas id="edgeFmt" width="720" height="80"></canvas>
    <div class="stats">
      <div class="stat-box">
        <div class="stat-val" id="bandCount">0</div>
        <div class="stat-label">检测到的色带边界</div>
      </div>
      <div class="stat-box">
        <div class="stat-val" id="uniqueColors">0</div>
        <div class="stat-label">画面中的独立颜色数</div>
      </div>
      <div class="stat-box">
        <div class="stat-val" id="colorLevels">256</div>
        <div class="stat-label">格式支持的色阶数</div>
      </div>
    </div>
    <div class="desc" id="fmtDesc">U8 的 256 级在彩虹渐变上通常会产生少量色带边界（约 10~20 个）。U5 仅 32 级，边界会多达 100+ 个，形成明显条纹。</div>
  </div>
</div>
<script>
const W = 720, H = 80;

function hsv2rgb(h, s, v) {
  const c = v * s;
  const x = c * (1 - Math.abs((h / 60) % 2 - 1));
  const m = v - c;
  let r, g, b;
  if (h < 60) { r = c; g = x; b = 0; }
  else if (h < 120) { r = x; g = c; b = 0; }
  else if (h < 180) { r = 0; g = c; b = x; }
  else if (h < 240) { r = 0; g = x; b = c; }
  else if (h < 300) { r = x; g = 0; b = c; }
  else { r = c; g = 0; b = x; }
  return [Math.floor((r + m) * 255), Math.floor((g + m) * 255), Math.floor((b + m) * 255)];
}

function quantize(val, bits) {
  const maxVal = (1 << bits) - 1;
  return Math.floor(Math.floor(val / 255 * maxVal) / maxVal * 255);
}

function drawFormat() {
  const mode = document.getElementById('fmtSelect').value;
  const bitsMap = { f32_u8: 8, f32_u16: 16, f16_u8: 8, u8_u5: 5, u8_u6: 6, u8_u4: 4 };
  const bits = bitsMap[mode];
  const descs = {
    f32_u8: 'U8 的 256 级：彩虹渐变上可见少量色带（约 10~20 个边界）。',
    f32_u16: 'U16 的 65536 级：理论上无可见色带，边界检测全黑。',
    f16_u8: 'f16→U8：先损失浮点精度再量化，比 f32→U8 略差。',
    u8_u5: 'U5 仅 32 级：色带极其明显，像彩色条形码！',
    u8_u6: 'U6 仅 64 级：色带明显可见，约 80+ 个边界。',
    u8_u4: 'U4 仅 16 级：已经不能叫渐变，叫色块。'
  };
  document.getElementById('fmtDesc').textContent = descs[mode];
  document.getElementById('colorLevels').textContent = (1 << bits);

  // Source: perfect rainbow
  const ctxS = document.getElementById('srcFmt').getContext('2d');
  const imgS = new ImageData(W, H);
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const hue = (x / W) * 360;
      const [r, g, b] = hsv2rgb(hue, 0.85, 0.95);
      const i = (y * W + x) * 4;
      imgS.data[i] = r; imgS.data[i+1] = g; imgS.data[i+2] = b; imgS.data[i+3] = 255;
    }
  }
  ctxS.putImageData(imgS, 0, 0);

  // Quantized
  const ctxD = document.getElementById('dstFmt').getContext('2d');
  const imgD = new ImageData(W, H);
  const colorSet = new Set();
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const hue = (x / W) * 360;
      const [r, g, b] = hsv2rgb(hue, 0.85, 0.95);
      const i = (y * W + x) * 4;
      const qr = quantize(r, bits);
      const qg = quantize(g, bits);
      const qb = quantize(b, bits);
      imgD.data[i] = qr; imgD.data[i+1] = qg; imgD.data[i+2] = qb; imgD.data[i+3] = 255;
      colorSet.add(`${qr},${qg},${qb}`);
    }
  }
  ctxD.putImageData(imgD, 0, 0);

  // Edge detection: horizontal difference
  const ctxE = document.getElementById('edgeFmt').getContext('2d');
  const imgE = new ImageData(W, H);
  let bandCount = 0;
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 4;
      const iPrev = (y * W + Math.max(0, x - 1)) * 4;
      const diff = Math.abs(imgD.data[i] - imgD.data[iPrev]) +
                   Math.abs(imgD.data[i+1] - imgD.data[iPrev+1]) +
                   Math.abs(imgD.data[i+2] - imgD.data[iPrev+2]);
      if (diff > 3 && x > 0) {
        imgE.data[i] = 255; imgE.data[i+1] = 255; imgE.data[i+2] = 255; imgE.data[i+3] = 255;
        bandCount++;
      } else {
        imgE.data[i] = 10; imgE.data[i+1] = 15; imgE.data[i+2] = 25; imgE.data[i+3] = 255;
      }
    }
  }
  ctxE.putImageData(imgE, 0, 0);

  document.getElementById('bandCount').textContent = Math.floor(bandCount / H); // per row average
  document.getElementById('uniqueColors').textContent = colorSet.size;
}
drawFormat();
</script>
</body>
</html>
