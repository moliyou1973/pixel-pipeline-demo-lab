<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Memory Layout 内存排布演示</title>
<style>
body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0b0f19; color: #e2e8f0; padding: 20px; margin: 0; }
h2 { color: #a3e635; margin: 0 0 8px 0; font-size: 18px; }
.subtitle { color: #94a3b8; font-size: 13px; margin-bottom: 16px; }
.container { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 800px; }
.card { background: #151b2e; border: 1px solid #2d3a5c; border-radius: 8px; padding: 12px; }
.card-title { font-size: 13px; font-weight: bold; margin-bottom: 8px; }
canvas { width: 100%; border-radius: 4px; background: #000; image-rendering: pixelated; }
.controls { display: flex; gap: 8px; margin-top: 10px; }
button { flex: 1; background: #1e293b; color: #94a3b8; border: 1px solid #475569; border-radius: 4px; padding: 8px; font-size: 12px; cursor: pointer; }
button.active { background: #2d3a5c; color: #e2e8f0; border-color: #a3e635; }
.desc { font-size: 11px; color: #94a3b8; margin-top: 8px; line-height: 1.5; }
.stats { font-size: 11px; color: #64748b; margin-top: 6px; }
</style>
<base target="_blank">
</head>
<body>
<h2>🧩 Memory Layout — Linear vs Twiddle (Z-Order)</h2>
<div class="subtitle">场景：16×16 纹理块按不同顺序存储。Twiddle (Z-Order/Morton Code) 保持空间局部性，提升缓存命中率。</div>
<div class="container">
  <div class="card">
    <div class="card-title">内存地址热力图 + 访问路径</div>
    <canvas id="memCanvas" width="280" height="280"></canvas>
    <div class="controls">
      <button onclick="setMemLayout('linear')" class="mem-btn active" data-layout="linear">Linear</button>
      <button onclick="setMemLayout('twiddle')" class="mem-btn" data-layout="twiddle">Twiddle (Z-Order)</button>
    </div>
    <div class="desc" id="memDesc">线性排列: (x,y) → addr = y*W + x。缓存不友好，相邻行地址跳跃大。</div>
    <div class="stats" id="memStats">缓存行命中率估算: ~6%</div>
  </div>
  <div class="card">
    <div class="card-title">访问顺序动画</div>
    <canvas id="animCanvas" width="280" height="280"></canvas>
    <div class="desc">黄色光点按内存地址顺序访问像素。Twiddle 时访问路径呈 Z 字形，始终保持在局部区域。</div>
  </div>
</div>
<script>
const W = 280, H = 280;
const gridW = 16, gridH = 16;
const cellW = W / gridW, cellH = H / gridH;
let memLayout = 'linear';
let animFrame = 0;

function interleave(x, y) {
  let z = 0;
  for (let i = 0; i < 8; i++) {
    z |= ((x >> i) & 1) << (2 * i);
    z |= ((y >> i) & 1) << (2 * i + 1);
  }
  return z;
}

function setMemLayout(layout) {
  memLayout = layout;
  document.querySelectorAll('.mem-btn').forEach(b => b.classList.toggle('active', b.dataset.layout === layout));
  document.getElementById('memDesc').textContent = layout === 'linear' 
    ? '线性排列: (x,y) → addr = y*W + x。缓存不友好，相邻行地址跳跃大。'
    : 'Twiddle/Z-Order: (x,y) → addr = interleave(x,y)。保持空间局部性，缓存命中率高。';
  document.getElementById('memStats').textContent = layout === 'linear' 
    ? '缓存行命中率估算: ~6% (每行仅1像素在缓存中)' 
    : '缓存行命中率估算: ~75% (Z-Order 保持 2×2/4×4 局部性)';
}

function drawMem() {
  const ctx = document.getElementById('memCanvas').getContext('2d');
  const img = ctx.createImageData(W, H);
  for (let i = 0; i < W*H*4; i+=4) { img.data[i]=5; img.data[i+1]=8; img.data[i+2]=15; img.data[i+3]=255; }

  const accesses = [];
  for (let y = 0; y < gridH; y++) {
    for (let x = 0; x < gridW; x++) {
      const addr = memLayout === 'linear' ? y * gridW + x : interleave(x, y);
      accesses.push({x, y, addr, order: memLayout === 'linear' ? y*gridW+x : addr});
    }
  }
  accesses.sort((a, b) => a.order - b.order);

  accesses.forEach((acc, idx) => {
    const cx = acc.x * cellW, cy = acc.y * cellH;
    const heat = idx / accesses.length;
    const r = Math.floor(heat * 255);
    const g = Math.floor((1-heat) * 100 + 50);
    const b = Math.floor(heat * 50 + 100);
    for (let dy = 1; dy < cellH-1; dy++) {
      for (let dx = 1; dx < cellW-1; dx++) {
        const px = Math.floor(cx + dx), py = Math.floor(cy + dy);
        if (px < W && py < H) {
          const i = (py * W + px) * 4;
          img.data[i] = r; img.data[i+1] = g; img.data[i+2] = b; img.data[i+3] = 255;
        }
      }
    }
  });

  let lastX = null, lastY = null;
  accesses.slice(0, 64).forEach((acc, idx) => {
    const cx = Math.floor(acc.x * cellW + cellW/2);
    const cy = Math.floor(acc.y * cellH + cellH/2);
    if (lastX !== null) {
      const steps = Math.max(Math.abs(cx-lastX), Math.abs(cy-lastY));
      for (let s = 0; s <= steps; s++) {
        const lx = Math.floor(lastX + (cx-lastX)*s/steps);
        const ly = Math.floor(lastY + (cy-lastY)*s/steps);
        if (lx < W && ly < H) {
          const i = (ly * W + lx) * 4;
          img.data[i] = 255; img.data[i+1] = 255; img.data[i+2] = 100; img.data[i+3] = 255;
        }
      }
    }
    lastX = cx; lastY = cy;
  });
  ctx.putImageData(img, 0, 0);
}

function drawAnim() {
  const ctx = document.getElementById('animCanvas').getContext('2d');
  const img = ctx.createImageData(W, H);
  for (let i = 0; i < W*H*4; i+=4) { img.data[i]=5; img.data[i+1]=8; img.data[i+2]=15; img.data[i+3]=255; }

  const accesses = [];
  for (let y = 0; y < gridH; y++) {
    for (let x = 0; x < gridW; x++) {
      const addr = memLayout === 'linear' ? y * gridW + x : interleave(x, y);
      accesses.push({x, y, addr, order: memLayout === 'linear' ? y*gridW+x : addr});
    }
  }
  accesses.sort((a, b) => a.order - b.order);

  accesses.forEach((acc) => {
    const cx = Math.floor(acc.x * cellW + cellW/2);
    const cy = Math.floor(acc.y * cellH + cellH/2);
    for (let dy = -2; dy <= 2; dy++) {
      for (let dx = -2; dx <= 2; dx++) {
        const px = cx + dx, py = cy + dy;
        if (px >= 0 && px < W && py >= 0 && py < H) {
          const i = (py * W + px) * 4;
          img.data[i] = 40; img.data[i+1] = 60; img.data[i+2] = 100; img.data[i+3] = 255;
        }
      }
    }
  });

  // Animate current position
  const curIdx = Math.floor(animFrame) % accesses.length;
  const cur = accesses[curIdx];
  const cx = Math.floor(cur.x * cellW + cellW/2);
  const cy = Math.floor(cur.y * cellH + cellH/2);
  for (let dy = -4; dy <= 4; dy++) {
    for (let dx = -4; dx <= 4; dx++) {
      const px = cx + dx, py = cy + dy;
      if (px >= 0 && px < W && py >= 0 && py < H) {
        const i = (py * W + px) * 4;
        img.data[i] = 255; img.data[i+1] = 255; img.data[i+2] = 100; img.data[i+3] = 255;
      }
    }
  }

  // Draw trail
  for (let t = 1; t <= 10; t++) {
    const trailIdx = (curIdx - t + accesses.length) % accesses.length;
    const trail = accesses[trailIdx];
    const tx = Math.floor(trail.x * cellW + cellW/2);
    const ty = Math.floor(trail.y * cellH + cellH/2);
    const alpha = (11 - t) / 11;
    for (let dy = -2; dy <= 2; dy++) {
      for (let dx = -2; dx <= 2; dx++) {
        const px = tx + dx, py = ty + dy;
        if (px >= 0 && px < W && py >= 0 && py < H) {
          const i = (py * W + px) * 4;
          img.data[i] = Math.max(img.data[i], Math.floor(255 * alpha * 0.5));
          img.data[i+1] = Math.max(img.data[i+1], Math.floor(200 * alpha * 0.5));
          img.data[i+2] = Math.max(img.data[i+2], Math.floor(50 * alpha * 0.5));
        }
      }
    }
  }

  ctx.putImageData(img, 0, 0);
  animFrame += 0.5;
  requestAnimationFrame(drawAnim);
}

drawMem();
drawAnim();
</script>
</body>
</html>
