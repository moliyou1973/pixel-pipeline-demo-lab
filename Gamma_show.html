<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Gamma 校正 — 暗部细节恢复</title>
<style>
body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0b0f19; color: #e2e8f0; padding: 20px; margin: 0; }
h2 { color: #f472b6; margin: 0 0 8px 0; font-size: 18px; }
.subtitle { color: #94a3b8; font-size: 13px; margin-bottom: 16px; }
.container { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; max-width: 960px; }
.card { background: #151b2e; border: 1px solid #2d3a5c; border-radius: 8px; padding: 12px; }
.card-title { font-size: 12px; font-weight: bold; margin-bottom: 6px; }
.tag { display: inline-block; padding: 2px 6px; border-radius: 3px; font-size: 10px; margin-left: 6px; }
canvas { width: 100%; border-radius: 4px; background: #000; image-rendering: pixelated; }
.controls { margin-top: 12px; }
input[type=range] { width: 100%; accent-color: #f472b6; }
.label-row { display: flex; justify-content: space-between; font-size: 11px; color: #64748b; margin-top: 4px; }
.desc { font-size: 11px; color: #94a3b8; margin-top: 8px; line-height: 1.5; }
.arrow { text-align: center; font-size: 20px; color: #f472b6; margin: 60px 0; }
</style>
<base target="_blank">
</head>
<body>
<h2>📐 Gamma 校正 — 地下城暗部细节</h2>
<div class="subtitle">场景：昏暗地下城。墙上有砖块纹理，远处有绿色出口标志，地面有石板缝隙。Gamma=1.0 时暗部全黑；Gamma=2.2 时细节全部显现。</div>
<div class="container">
  <div class="card">
    <div class="card-title">Linear (γ=1.0) <span class="tag" style="background:#7c2d12;color:#fca5a5;">暗部死黑</span></div>
    <canvas id="linearCanvas" width="300" height="200"></canvas>
    <div class="desc">暗部码值极低，砖墙、地面缝隙、远处出口标志几乎完全消失，变成一片死黑。</div>
  </div>
  <div class="card">
    <div class="card-title">Gamma 曲线</div>
    <canvas id="curveCanvas" width="300" height="120" style="margin-bottom:8px;"></canvas>
    <div class="controls">
      <label style="font-size:12px;color:#cbd5e1;">γ: <span id="gammaVal" style="color:#f472b6;font-weight:bold;">2.20</span></label>
      <input type="range" id="gammaSlider" min="10" max="350" value="220">
      <div class="label-row"><span>1.0</span><span>2.2 (sRGB)</span><span>3.5</span></div>
    </div>
    <div class="desc">γ=1.0：暗部压缩。γ=2.2：人眼感知均匀。γ>3.0：暗部发灰。</div>
  </div>
  <div class="card">
    <div class="card-title">Gamma 输出 <span class="tag" style="background:#065f46;color:#6ee7b7;">细节可见</span></div>
    <canvas id="gammaCanvas" width="300" height="200"></canvas>
    <div class="desc">暗部被拉伸，砖块纹理、石板缝隙、绿色 "EXIT" 标志全部清晰可见。</div>
  </div>
</div>
<script>
const W = 300, H = 200;
function lerp(a,b,t){return a+(b-a)*t;}
function clamp(v,min,max){return Math.max(min,Math.min(max,v));}

function genDungeon(x, y) {
  const nx = x / W, ny = y / H;
  // Very dark base
  let r = 8, g = 8, b = 12;

  // Brick wall pattern (subtle, in dark area)
  const brickW = 30, brickH = 14;
  const bx = x % brickW, by = y % brickH;
  const brickEdge = (bx < 1 || by < 1 || bx > brickW-2);
  const brickRow = Math.floor(y / brickH);
  const brickOffset = (brickRow % 2) * (brickW / 2);
  const brickX = (x + brickOffset) % brickW;
  const isBrickEdge = (brickX < 1 || by < 1);

  // Brick brightness: very subtle, only visible with gamma
  if (ny < 0.6) {
    const brickBright = isBrickEdge ? 0.025 : 0.012;
    r += brickBright * 255;
    g += brickBright * 200;
    b += brickBright * 180;
  }

  // Floor stones (bottom area)
  if (ny > 0.65) {
    const stoneSize = 40;
    const sx = x % stoneSize, sy = (y - H*0.65) % stoneSize;
    const stoneEdge = (sx < 2 || sy < 2);
    const stoneBright = stoneEdge ? 0.03 : 0.015;
    r += stoneBright * 200;
    g += stoneBright * 180;
    b += stoneBright * 160;
  }

  // EXIT sign (green, far back, very dim)
  if (nx > 0.7 && nx < 0.9 && ny > 0.25 && ny < 0.4) {
    const sx = (nx - 0.7) / 0.2, sy = (ny - 0.25) / 0.15;
    // E
    if (sy > 0.2 && sy < 0.8 && sx > 0.1 && sx < 0.3) {
      if (Math.abs(sx-0.15)<0.04 || Math.abs(sy-0.2)<0.04 || Math.abs(sy-0.5)<0.04 || Math.abs(sy-0.8)<0.04) {
        r += 0.04 * 255; g += 0.08 * 255; b += 0.02 * 255;
      }
    }
    // X
    if ((Math.abs(sy-sx*0.8-0.1)<0.05 || Math.abs(sy+sx*0.8-0.9)<0.05) && sx > 0.4 && sx < 0.6) {
      r += 0.04 * 255; g += 0.08 * 255; b += 0.02 * 255;
    }
    // I
    if (sx > 0.7 && sx < 0.8 && sy > 0.2 && sy < 0.8) {
      r += 0.04 * 255; g += 0.08 * 255; b += 0.02 * 255;
    }
    // T
    if (sx > 0.85 && sx < 0.95 && sy > 0.2 && sy < 0.8) {
      r += 0.04 * 255; g += 0.08 * 255; b += 0.02 * 255;
    }
    if (sy > 0.2 && sy < 0.28 && sx > 0.82 && sx < 0.98) {
      r += 0.04 * 255; g += 0.08 * 255; b += 0.02 * 255;
    }
  }

  // Torch on left wall (bright area for contrast)
  const tdx = x - 50, tdy = y - 80;
  const tdist = Math.sqrt(tdx*tdx + tdy*tdy);
  if (tdist < 35) {
    const tbright = (1 - tdist/35) * 0.4;
    r += tbright * 255;
    g += tbright * 180;
    b += tbright * 60;
  }

  // Flicker
  const flicker = Math.sin(Date.now() * 0.005) * 0.02 + 1;
  r *= flicker; g *= flicker; b *= flicker;

  return [clamp(r,0,255), clamp(g,0,255), clamp(b,0,255)];
}

function draw() {
  const gamma = parseInt(document.getElementById('gammaSlider').value) / 100;
  document.getElementById('gammaVal').textContent = gamma.toFixed(2);

  const baseImg = new ImageData(W, H);
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const [r,g,b] = genDungeon(x, y);
      const i = (y * W + x) * 4;
      baseImg.data[i] = r; baseImg.data[i+1] = g; baseImg.data[i+2] = b; baseImg.data[i+3] = 255;
    }
  }

  // Linear view (raw values)
  const ctxL = document.getElementById('linearCanvas').getContext('2d');
  ctxL.putImageData(baseImg, 0, 0);

  // Gamma view
  const ctxG = document.getElementById('gammaCanvas').getContext('2d');
  const imgG = new ImageData(W, H);
  for (let i = 0; i < baseImg.data.length; i += 4) {
    imgG.data[i] = Math.floor(Math.pow(baseImg.data[i] / 255, 1/gamma) * 255);
    imgG.data[i+1] = Math.floor(Math.pow(baseImg.data[i+1] / 255, 1/gamma) * 255);
    imgG.data[i+2] = Math.floor(Math.pow(baseImg.data[i+2] / 255, 1/gamma) * 255);
    imgG.data[i+3] = 255;
  }
  ctxG.putImageData(imgG, 0, 0);

  // Curve
  const ctxC = document.getElementById('curveCanvas').getContext('2d');
  ctxC.fillStyle = '#0f172a';
  ctxC.fillRect(0, 0, 300, 120);
  ctxC.strokeStyle = '#334155';
  ctxC.lineWidth = 1;
  for (let x = 0; x < 300; x += 30) { ctxC.beginPath(); ctxC.moveTo(x,0); ctxC.lineTo(x,120); ctxC.stroke(); }
  for (let y = 0; y < 120; y += 24) { ctxC.beginPath(); ctxC.moveTo(0,y); ctxC.lineTo(300,y); ctxC.stroke(); }
  ctxC.strokeStyle = '#f472b6';
  ctxC.lineWidth = 2.5;
  ctxC.beginPath();
  for (let x = 0; x < 300; x++) {
    const inVal = x / 300;
    const outVal = Math.pow(inVal, 1.0 / gamma);
    const cy = 120 - outVal * 100 - 10;
    if (x === 0) ctxC.moveTo(x, cy); else ctxC.lineTo(x, cy);
  }
  ctxC.stroke();
  ctxC.fillStyle = '#94a3b8';
  ctxC.font = '10px sans-serif';
  ctxC.fillText('Input (Linear)', 5, 115);
  ctxC.fillText('Output', 260, 15);

  requestAnimationFrame(draw);
}
document.getElementById('gammaSlider').addEventListener('input', draw);
draw();
</script>
</body>
</html>
